apiVersion: batch/v1
kind: Job
metadata:
  name: web-content-migrate
  namespace: web-content
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: web-content-api:PLACEHOLDER
          command:
            - /bin/sh
            - -c
            - |
              echo "Running migrations for web-content-api..."
              # Replace with appropriate migration command (Prisma/Flyway/etc.)
              npx prisma migrate deploy || {
                echo "Migration failed"; exit 1; }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: web-content-db-url
                  key: DATABASE_URL
