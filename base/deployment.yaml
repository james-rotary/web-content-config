apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-content-api
  namespace: web-content
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-content-api
  template:
    metadata:
      labels:
        app: web-content-api
    spec:
      containers:
        - name: app
          image: web-content-api:PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: web-content-db-url
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
